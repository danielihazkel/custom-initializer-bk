server:
  port: 8080
  # Previews carry every generated file's content as JSON (hundreds of KB); gzip them and the
  # metadata. Zips are application/octet-stream — already compressed, so never listed here.
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - application/json
      - application/problem+json
      - application/hal+json
      - application/vnd.initializr.v2+json
      - application/vnd.initializr.v2.1+json
      - application/vnd.initializr.v2.2+json
      - application/vnd.initializr.v2.3+json
      - text/plain
      - text/html
      - text/css
      - application/javascript

admin:
  password: changeme
  # Login tokens are HMAC-signed, so any instance can check them. Every replica must share the
  # same password (or token-secret, which takes precedence when set).
  # token-secret:
  token-ttl: 12h
  # Wrong passwords from one address before it is refused (429) until the window has passed;
  # 0 switches the limit off. Counted per instance. See AdminLoginThrottle.
  login:
    max-failures: 10
    window: 5m

spring:
  cache:
    type: jcache
  datasource:
    url: jdbc:h2:file:./data/initializr
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # Off: with open-in-view every request keeps a pooled connection from its first query to the
    # end of the response — a generation would hold one through rendering and zipping, capping
    # concurrent generations at the pool size. Anything serialized must be fetched up front.
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    # Feature branches number their migrations independently (the design-kit branch holds V24/V25,
    # this line continues at V26), and one database file is often run on more than one of them.
    # So a migration applied by another branch is tolerated ("missing"/"future"), and one that
    # arrives later with a lower number is still applied (out-of-order).
    out-of-order: true
    ignore-migration-patterns: "*:missing,*:future"
  h2:
    console:
      # Off: the console is a SQL prompt on the catalog database (user "sa", no password) and is
      # not behind the admin login. On a developer's machine: --spring.h2.console.enabled=true.
      enabled: false
      path: /h2-console

initializr:
  group-id:
    value: com.menora
  artifact-id:
    value: demo
  version:
    value: 0.0.1-SNAPSHOT
  name:
    value: demo
  description:
    value: Menora Spring Boot project
  package-name:
    value: com.menora.demo
  # Java versions, Boot versions, and frontend versions live in the
  # version_definition table (see V15 migration + VersionService). Manage
  # them via the admin UI or POST /admin/versions.
  # Java and Maven only. Kotlin and Gradle used to be listed, and could not work: every build
  # customizer is a BuildCustomizer<MavenBuild>, every template is Java, and the Dockerfile and
  # Jenkinsfile run mvn. A request that names either is turned away by the framework.
  languages:
    - name: Java
      id: java
      default: true
  configuration-file-formats:
    - name: properties
      id: properties
      default: true
    - name: yaml
      id: yaml
  packagings:
    - name: Jar
      id: jar
      default: true
    - name: War
      id: war
  types:
    - name: Maven Project
      id: maven-project
      description: Generate a Maven-based project archive
      default: true
      action: /starter.zip
      tags:
        build: maven
        format: project
  env:
    repositories:
      menora-release:
        name: Menora Artifactory Releases
        url: https://repo.menora.co.il/artifactory/libs-release
        releases-enabled: true
        snapshots-enabled: false
      menora-snapshot:
        name: Menora Artifactory Snapshots
        url: https://repo.menora.co.il/artifactory/libs-snapshot
        releases-enabled: false
        snapshots-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

menora:
  wizard:
    # The documents pasted into the wizards (SQL, OpenAPI, WSDL, AsyncAPI) of one request,
    # together. Each is parsed in memory, so a request past this is answered 400.
    max-documents-size: 5MB
  audit:
    log-remote-addr: true
  access:
    # true: a request without the SSO gateway's user header (menora.audit.user-header, "userinfo"
    # unless renamed) is answered 403 and the UI shows a "No access" screen. Off by default; turn
    # it on per environment with MENORA_ACCESS_REQUIRE_USER_HEADER=true (or a profile file).
    require-user-header: false
    # Still answered without the header, as comma-separated Ant patterns: Kubernetes probes do
    # not pass the gateway.
    open-paths: /actuator/**

frontend:
  # React versions, Node versions, and package managers live in the
  # version_definition table (see V15 + VersionService). Manage them via
  # the admin UI or POST /admin/versions.
  pinned:
    typescript: "5.4.5"
    vite: "5.2.0"
  defaults:
    project-name: demo
    description: Menora React + TS + Vite project
    app-title: Demo
    scope: ""
