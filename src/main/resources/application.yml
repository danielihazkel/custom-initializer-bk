server:
  port: 8080
  # Previews carry every generated file's content as JSON (hundreds of KB); gzip them and the
  # metadata. Zips are application/octet-stream — already compressed, so never listed here.
  compression:
    enabled: true
    min-response-size: 2KB
    mime-types:
      - application/json
      - application/problem+json
      - application/hal+json
      - application/vnd.initializr.v2+json
      - application/vnd.initializr.v2.1+json
      - application/vnd.initializr.v2.2+json
      - application/vnd.initializr.v2.3+json
      - text/plain
      - text/html
      - text/css
      - application/javascript
      - text/javascript

admin:
  password: changeme
  # Login tokens are HMAC-signed, so any instance can check them. Every replica must share the
  # same password (or token-secret, which takes precedence when set).
  # token-secret:
  token-ttl: 12h

spring:
  cache:
    type: jcache
  servlet:
    multipart:
      # Design-kit assets (AssetValidator.MAX_BYTES is 2 MB; a little room for the form fields).
      max-file-size: 3MB
      max-request-size: 4MB
  datasource:
    url: jdbc:h2:file:./data/initializr
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # Off: with open-in-view every request keeps a pooled connection from its first query to the
    # end of the response — a generation would hold one through rendering and zipping, capping
    # concurrent generations at the pool size. Anything serialized must be fetched up front.
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  h2:
    console:
      enabled: true
      path: /h2-console

initializr:
  group-id:
    value: com.menora
  artifact-id:
    value: demo
  version:
    value: 0.0.1-SNAPSHOT
  name:
    value: demo
  description:
    value: Menora Spring Boot project
  package-name:
    value: com.menora.demo
  # Java versions, Boot versions, and frontend versions live in the
  # version_definition table (see V15 migration + VersionService). Manage
  # them via the admin UI or POST /admin/versions.
  languages:
    - name: Java
      id: java
      default: true
    - name: Kotlin
      id: kotlin
  configuration-file-formats:
    - name: properties
      id: properties
      default: true
    - name: yaml
      id: yaml
  packagings:
    - name: Jar
      id: jar
      default: true
    - name: War
      id: war
  types:
    - name: Maven Project
      id: maven-project
      description: Generate a Maven-based project archive
      default: true
      action: /starter.zip
      tags:
        build: maven
        format: project
    - name: Gradle Project
      id: gradle-project
      description: Generate a Gradle-based project archive
      action: /starter.zip
      tags:
        build: gradle
        format: project
  env:
    repositories:
      menora-release:
        name: Menora Artifactory Releases
        url: https://repo.menora.co.il/artifactory/libs-release
        releases-enabled: true
        snapshots-enabled: false
      menora-snapshot:
        name: Menora Artifactory Snapshots
        url: https://repo.menora.co.il/artifactory/libs-snapshot
        releases-enabled: false
        snapshots-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

menora:
  audit:
    log-remote-addr: true

frontend:
  # React versions, Node versions, and package managers live in the
  # version_definition table (see V15 + VersionService). Manage them via
  # the admin UI or POST /admin/versions.
  pinned:
    typescript: "5.4.5"
    vite: "5.2.0"
  defaults:
    project-name: demo
    description: Menora React + TS + Vite project
    app-title: Demo
    scope: ""
