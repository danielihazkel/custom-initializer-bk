server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API: the SPA calls /api/... and nginx forwards it to the backend. API_UPSTREAM is
  # substituted by entrypoint.sh at container start (default http://localhost:8080); no trailing
  # URI on proxy_pass keeps the original /api/... path.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;   # CSV export streams
  }

  # SPA fallback — every unknown path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively; the build emits fingerprinted file names.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
