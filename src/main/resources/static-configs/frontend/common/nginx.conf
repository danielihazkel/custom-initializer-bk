server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every unknown path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively; the build emits fingerprinted file names.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
