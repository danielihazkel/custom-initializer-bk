ldap:
  enabled: true
  uri: ${LDAP_URI:ldap://menoramivt.net:389}
  # user and password are Base64-encoded (see Base64Utils).
  user: ${LDAP_USER:}
  password: ${LDAP_PASSWORD:}
  search-base: ${LDAP_SEARCH_BASE:OU=MenoraMivtahim,DC=menoramivt,DC=net}
  access-base: ${LDAP_ACCESS_BASE:OU=ServiceAccounts,OU=MenoMivtSystem,DC=menoramivt,DC=net}

# Prefix of the LDAP groups that grant access; roles map to "<prefix>ALL" / "<prefix>RO".
header:
  prefix: ${PERMISSION_GROUP_PREFIX:GRP_LTSMonitoringUi_}
