spring:
  datasource:
    url: ${H2_DB_URL:jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
    username: ${H2_DB_USERNAME:sa}
    password: ${H2_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
# Mirror under the h2.* prefix for the multi-datasource pattern, where
# H2Config.java binds @ConfigurationProperties(prefix = "h2.datasource") and
# the EntityManagerFactory reads h2.hibernate.* directly from the Environment.
# When that config class isn't generated (single-datasource case), the
# spring.* block above is what Spring Boot auto-config actually consumes.
h2:
  datasource:
    url: ${H2_DB_URL:jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false}
    username: ${H2_DB_USERNAME:sa}
    password: ${H2_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  hibernate:
    dialect: org.hibernate.dialect.H2Dialect
    hbm2ddl-auto: create-drop
