asyncapi: 3.0.0
info:
  title: Orders
  version: 1.0.0
  description: Every shape the events wizard renders differently (WizardGoldenOutputTests), as an AsyncAPI 3 document.
channels:
  orderCreated:
    address: orders.created
    description: A new order */ was placed
    messages:
      orderCreated:
        $ref: '#/components/messages/OrderCreated'
  orderEvents:
    address: orders.events
    messages:
      shipped:
        $ref: '#/components/messages/OrderShipped'
      cancelled:
        $ref: '#/components/messages/OrderCancelled'
  stockLevels:
    address: inventory.stock-levels
    messages:
      levels:
        name: StockLevels
        payload:
          type: array
          items:
            $ref: '#/components/schemas/StockLevel'
  heartbeat:
    address: ops.heartbeat
    messages:
      beat:
        name: beat
  userInbox:
    address: users.{userId}.inbox
    messages:
      note:
        name: note
        payload:
          type: string
operations:
  publishOrderCreated:
    action: send
    channel:
      $ref: '#/channels/orderCreated'
  onOrderCreated:
    action: receive
    channel:
      $ref: '#/channels/orderCreated'
  onOrderEvent:
    action: receive
    channel:
      $ref: '#/channels/orderEvents'
    messages:
      - $ref: '#/channels/orderEvents/messages/shipped'
      - $ref: '#/channels/orderEvents/messages/cancelled'
  publishStock:
    action: send
    channel:
      $ref: '#/channels/stockLevels'
  beat:
    action: send
    channel:
      $ref: '#/channels/heartbeat'
  inbox:
    action: receive
    channel:
      $ref: '#/channels/userInbox'
components:
  messages:
    OrderCreated:
      name: OrderCreated
      title: An order was created
      payload:
        $ref: '#/components/schemas/Order'
    OrderShipped:
      name: OrderShipped
      payload:
        type: object
        required: [order_id]
        properties:
          order_id: { type: integer, format: int64 }
          carrier: { type: string, enum: [dhl, ups] }
          shipped-at: { type: string, format: date-time }
    OrderCancelled:
      name: OrderCancelled
      payload:
        schemaFormat: application/vnd.aai.asyncapi+json;version=3.0.0
        schema:
          type: object
          properties:
            order_id: { type: integer, format: int64 }
            reason: { type: string, maxLength: 200 }
  schemas:
    Order:
      type: object
      required: [id, status, lines]
      properties:
        id: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/OrderStatus'
        placedAt: { type: string, format: date-time }
        customer_email: { type: string, format: email }
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
    OrderLine:
      type: object
      required: [sku, quantity]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
    OrderStatus:
      type: string
      enum: [new, paid, in-delivery]
    StockLevel:
      type: object
      properties:
        sku: { type: string }
        available: { type: integer }
