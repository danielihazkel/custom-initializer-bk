asyncapi: 2.6.0
info:
  title: Orders
  version: 1.0.0
  description: The same events as orders-asyncapi-v3.yaml, as an AsyncAPI 2 document.
channels:
  orders.created:
    description: A new order */ was placed
    # In 2.x the words are a client's: what clients subscribe to, the application sends.
    subscribe:
      operationId: publishOrderCreated
      message:
        $ref: '#/components/messages/OrderCreated'
    publish:
      operationId: onOrderCreated
      message:
        $ref: '#/components/messages/OrderCreated'
  orders.events:
    publish:
      operationId: onOrderEvent
      message:
        oneOf:
          - $ref: '#/components/messages/OrderShipped'
          - $ref: '#/components/messages/OrderCancelled'
  inventory.stock-levels:
    subscribe:
      operationId: publishStock
      message:
        name: StockLevels
        payload:
          type: array
          items:
            $ref: '#/components/schemas/StockLevel'
  ops.heartbeat:
    subscribe:
      operationId: beat
      message:
        name: beat
  users.{userId}.inbox:
    parameters:
      userId:
        schema: { type: string }
    publish:
      operationId: inbox
      message:
        name: note
        payload:
          type: string
components:
  messages:
    OrderCreated:
      name: OrderCreated
      title: An order was created
      payload:
        $ref: '#/components/schemas/Order'
    OrderShipped:
      name: OrderShipped
      payload:
        type: object
        required: [order_id]
        properties:
          order_id: { type: integer, format: int64 }
          carrier: { type: string, enum: [dhl, ups] }
          shipped-at: { type: string, format: date-time }
    OrderCancelled:
      name: OrderCancelled
      schemaFormat: application/vnd.aai.asyncapi;version=2.6.0
      payload:
        type: object
        properties:
          order_id: { type: integer, format: int64 }
          reason: { type: string, maxLength: 200 }
  schemas:
    Order:
      type: object
      required: [id, status, lines]
      properties:
        id: { type: integer, format: int64 }
        status:
          $ref: '#/components/schemas/OrderStatus'
        placedAt: { type: string, format: date-time }
        customer_email: { type: string, format: email }
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderLine'
    OrderLine:
      type: object
      required: [sku, quantity]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1 }
    OrderStatus:
      type: string
      enum: [new, paid, in-delivery]
    StockLevel:
      type: object
      properties:
        sku: { type: string }
        available: { type: integer }
